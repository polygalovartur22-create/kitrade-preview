# Add these directives inside the existing server block for xn--d1abifc1bn.xn--p1ai.
# The document root must point to the uploaded contents of dist/.
index index.html;
error_page 404 /404.html;

location = /catalog {
    return 301 /catalog/;
}

location = /catalog.html {
    return 301 /catalog/;
}

location / {
    try_files $uri $uri/ =404;
}
