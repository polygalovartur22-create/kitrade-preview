[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/catalog"
  to = "/catalog/"
  status = 301
  force = true

[[redirects]]
  from = "/catalog.html"
  to = "/catalog/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
